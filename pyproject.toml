[project]
name = "hermes-panel"
version = "0.1.0"
description = "Pannello di controllo della toolbox di sicurezza Hermes"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    # Pinnata anche se e' una dipendenza transitiva di FastAPI, perche' il
    # codice usa direttamente le sue costanti di stato HTTP e `fastapi`
    # accetta un intervallo largo (>=0.40,<0.49). Senza questo pin, due
    # ambienti che installano lo stesso pyproject in momenti diversi
    # ottengono starlette diverse: e' accaduto, e il sintomo e' stato una
    # costante rinominata fra due versioni che faceva fallire la suite in CI
    # e non in locale. Un pin su cio' di cui si usa l'API, non su tutto.
    "starlette==0.48.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "argon2-cffi==23.1.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La radice del repository su sys.path, dichiarata invece che ottenuta per
# effetto collaterale. Serve a `from tests.helpers import ...`: con
# `python -m pytest` la cwd finisce su sys.path da sola, con l'eseguibile
# `pytest` no, e la suite collezionava in un modo e non nell'altro.
pythonpath = ["."]
# Una DeprecationWarning e' un errore: serve a non accorgersi fra un anno
# che una API usata qui era deprecata da tempo. L'eccezione sotto riguarda
# codice di terze parti (il TestClient di Starlette passa da un alias
# deprecato di anyio), su cui non si puo' intervenire da qui.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
