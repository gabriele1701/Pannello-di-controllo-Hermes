id: hermes-missing-x-frame-options
info:
  name: Missing X-Frame-Options header
  author: hermes-vspt
  severity: low
  description: The HTTP response does not include X-Frame-Options.
  tags: misconfig,headers,hermes
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: dsl
        dsl:
          - "status_code >= 200 && status_code < 400 && !contains(tolower(all_headers), 'x-frame-options:')"
