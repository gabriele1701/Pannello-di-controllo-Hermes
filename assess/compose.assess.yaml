# Servizio scanner VSPT — BOZZA, DA COMPLETARE SULLA VM. Si usa come OVERRIDE
# del compose del pannello:
#
#     docker compose -f compose.yaml -f assess/compose.assess.yaml --profile assess \
#       run --rm scanner run --config /scope/scope.toml
#
# Cosi' lo scanner condivide il progetto con `app` e `db` e li raggiunge per
# nome di servizio. I valori che dipendono dalla VM sono <DA_COMPILARE>.
#
# Due reti, e il perche' (rilievo recepito)
# -----------------------------------------
# `internal: true` da solo NON regge questo disegno: una rete internal-only non
# ha gateway, quindi confina bene `app`/`db` ma chiude anche l'unica eccezione
# che serve, l'SSH verso l'host della VM (`host:22`). Da li' quel pacchetto non
# ha una via.
#
# Percio':
#   - `interna` (internal: true) collega scanner, app e db: nessuna uscita.
#   - `uscita` (con gateway) serve SOLO a raggiungere host:22, ed e' sorvegliata
#     dalle regole nft in assess/net/nftables-assess.nft (default drop + i soli
#     app/db/host:22). L'enforcement e' li', non in un if.
# L'egress self-check del tool resta la tripwire che verifica tutto questo.

services:
  scanner:
    build:
      context: ..
      dockerfile: assess/Dockerfile
    networks:
      - interna   # app, db (nessuna uscita)
      - uscita    # solo host:22, ristretta da nftables
    environment:
      # Solo NOMI qui: i valori arrivano dall'ambiente dell'host, non dal file.
      ASSESS_TARGET_PASSWORD: "${ASSESS_TARGET_PASSWORD:?serve la password demo}"
      ASSESS_DB_DSN: "${ASSESS_DB_DSN:?serve il DSN di hermes_assess}"
    # host.docker.internal mappa l'host della VM dal container (per l'SSH).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # CAP_NET_ADMIN serve ad applicare le regole nft DENTRO il container
    # (alternativa: applicarle sull'host filtrando per l'IP dello scanner).
    # Da abilitare sulla VM, insieme al montaggio del file di regole:
    # cap_add:
    #   - NET_ADMIN
    # La chiave SSH come secret montato, non come variabile:
    # secrets:
    #   - assess_ssh_key
    volumes:
      # La config di scope compilata e la directory dei report. <DA_COMPILARE>
      # i percorsi reali sulla VM.
      - ./scope.toml:/scope/scope.toml:ro
      - ./out:/opt/pannello/assess/out
      # Le regole di egress, montate in sola lettura e applicate all'avvio sulla VM:
      - ./net/nftables-assess.nft:/etc/assess/nftables-assess.nft:ro
    # Lo scanner NON parte da solo: niente scansioni al boot. Si lancia a mano
    # col sottocomando `run`. `profiles` evita che un `up` del pannello lo tiri
    # su per sbaglio.
    profiles:
      - assess

networks:
  interna:
    internal: true
    # app e db devono stare ANCHE su questa rete: nell'override si aggiunge
    # `interna` ai loro `networks`, oppure la si dichiara come rete condivisa
    # del progetto. Su internal:true restano raggiungibili tra loro e dallo
    # scanner, ma non escono verso Internet.
  uscita:
    # Rete con gateway: NON internal. Da sola darebbe egress pieno — e' il file
    # nft a restringerla alle sole app/db/host:22. Senza quelle regole applicate,
    # NON usare questa configurazione su una rete raggiungibile.
    driver: bridge

# secrets:
#   assess_ssh_key:
#     file: ./secrets/assess_ssh_key   # chiave privata, MAI nel repo
