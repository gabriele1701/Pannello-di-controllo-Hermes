# Orchestrazione: due servizi, `app` e `db`.
#
# Nessun segreto in questo file e nessun default funzionante per i segreti.
# La sintassi ${VAR:?messaggio} fa FALLIRE `docker compose up` se la variabile
# manca. E' deliberato: un default che funziona e' un default che resta in
# produzione, dove diventa una credenziale nota.
#
# NOTA SULLA SINTASSI, imparata rompendola: i valori che contengono
# `${VAR:?...}` sono scalari YAML **fra doppi apici**. Senza gli apici, un
# messaggio che contenga due punti seguiti da spazio -- "generarla: openssl
# ..." -- viene letto da YAML come un separatore chiave/valore, e l'intero
# file non si parsa. I messaggi qui restano brevi e la spiegazione sta nei
# commenti, che e' il posto giusto per starci.
#
# Avvio:
#     cp .env.example .env     # poi riempire i quattro valori obbligatori
#     docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      # Ruolo PROPRIETARIO delle tabelle. Lo usano solo migrazioni e seed.
      POSTGRES_USER: "${POSTGRES_USER:-hermes}"
      POSTGRES_DB: "${POSTGRES_DB:-hermes_panel}"
      # Nessun default: se manca, l'avvio fallisce.
      # Generarla con: openssl rand -base64 32
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?manca in .env, vedi .env.example}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Nessuna porta pubblicata. Il database e' raggiungibile solo dalla rete
    # interna del compose: l'unico client e' `app`, e un Postgres esposto su
    # localhost e' un Postgres esposto a qualunque processo della macchina.
    healthcheck:
      # Senza healthcheck, `app` partirebbe appena il container `db` esiste, che
      # e' prima che Postgres accetti connessioni: le migrazioni fallirebbero
      # all'avvio a freddo e solo lì, cioe' nel caso che bisogna dimostrare.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes} -d ${POSTGRES_DB:-hermes_panel}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # --- Due URL, due ruoli di database ------------------------------- #
      #
      # La separazione non e' cosmetica. In PostgreSQL il PROPRIETARIO di una
      # tabella puo' disabilitarne i trigger:
      #
      #     ALTER TABLE tier_overrides DISABLE TRIGGER ALL;
      #
      # Gli invarianti di questo progetto -- la monotonia del tier,
      # l'append-only sul log -- SONO trigger. Un'applicazione connessa come
      # proprietario avrebbe quindi a disposizione il comando che disattiva i
      # propri controlli di sicurezza, e con lei qualunque difetto del suo
      # codice.
      #
      # DATABASE_URL: il ruolo con cui gira l'applicazione. Non possiede
      # niente, non e' superutente, e ha le concessioni minime assegnate dalla
      # migrazione 0002 -- `tools` e `audit_events` in sola lettura comprese.
      DATABASE_URL: "postgresql+psycopg://hermes_app:${HERMES_APP_DB_PASSWORD:?manca in .env, vedi .env.example}@db:5432/${POSTGRES_DB:-hermes_panel}"

      # MIGRATIONS_DATABASE_URL: il ruolo proprietario. Lo usano SOLO
      # `alembic upgrade head` e il seed, all'avvio, prima che il server parta.
      MIGRATIONS_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:?manca in .env}@db:5432/${POSTGRES_DB:-hermes_panel}"

      # Letta dalla migrazione 0002, che imposta la password del ruolo
      # applicativo. Passa come parametro di bind e non come testo dello
      # statement, per non finire nel log delle query.
      HERMES_APP_DB_PASSWORD: "${HERMES_APP_DB_PASSWORD:?manca in .env}"

      # --- Sessione ------------------------------------------------------ #
      # Nessun default: una chiave di firma prevedibile permetterebbe a
      # chiunque di forgiare un cookie di sessione valido.
      # Generarla con: openssl rand -hex 32
      APP_SECRET_KEY: "${APP_SECRET_KEY:?manca in .env, generarla con openssl rand -hex 32}"
      APP_ENV: "${APP_ENV:-development}"

      # --- Operatore iniziale -------------------------------------------- #
      HERMES_ADMIN_USERNAME: "${HERMES_ADMIN_USERNAME:-operatore}"
      HERMES_ADMIN_PASSWORD: "${HERMES_ADMIN_PASSWORD:?manca in .env, senza non esiste nessun operatore con cui entrare}"
    ports:
      # Su 127.0.0.1 e non su 0.0.0.0: il pannello decide cosa gli agenti LLM
      # possono fare, e non deve essere raggiungibile dalla rete.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Il filesystem dell'immagine in sola lettura: il processo non puo'
    # riscrivere il proprio codice. /tmp resta scrivibile in memoria, perche'
    # alcune librerie ci appoggiano file temporanei.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  pgdata:
